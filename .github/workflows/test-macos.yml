name: xraydb python, macos, conda

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python from Miniconda
      uses: conda-incubator/setup-miniconda@v2.2.0
      with:
        miniconda-version: latest
        channels: conda-forge
        channel-priority: strict
        activate-environment: anaconda-client-env
        python-version: ${{ matrix.python-version }}
    - name: Install conda dependencies from conda-forge
      run: |
        printenv
        conda activate anaconda-client-env
        conda install -y -c conda-forge python=${{ matrix.python-version }} "numpy>=2.0" "scipy>=1.15"
        conda install -y -c conda-forge pytest pytest-cov coverage setuptools pip
        conda list
        conda info
    - name: Install xraydb with pip and run tests
      run: |
        conda activate anaconda-client-env
        cd python
        pip install ".[all]"
        cd tests
        python -m pytest
