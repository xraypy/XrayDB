name: xraydb python, ubuntu, conda

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python  ${{ matrix.python-version }} from Miniconda/conda
        uses: actions/setup-python@v4
        with:
            python-version: ${{ matrix.python-version }}
      - name: Install conda and dependencies
        run: |
          echo $CONDA/bin >> $GITHUB_PATH
          conda install -y -c conda-forge python=${{ matrix.python-version }} "numpy>=2" "scipy>=1.13"
          conda info
          conda list
      - name: Install xraydb and run tests
        run: |
          cd python
          pip install ".[all]"
          cd tests
          python -m pytest --cov=xraydb --cov-report=xml
      - name: upload coverage report to codecov
        uses: codecov/codecov-action@v2
